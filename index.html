<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Translator POC</title>
    <link rel="stylesheet" href="styles.css?v=20260516041630">
    <!-- Monaco Editor -->
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
</head>
<body>
    <!-- Header with Navigation -->
    <header class="header">
        <div class="header-content">
            <h1 class="header-title">🔄 Code Translator POC</h1>
            <nav class="header-navigation">
                <button class="tab-btn active" data-tab="jira">
                    <span class="tab-icon">📋</span>
                    <span class="tab-label">Tasks</span>
                </button>
                <button class="tab-btn" data-tab="editor">
                    <span class="tab-icon">💻</span>
                    <span class="tab-label">Code Editor</span>
                </button>
                <button class="tab-btn" data-tab="settings">
                    <span class="tab-icon">⚙️</span>
                    <span class="tab-label">User Settings</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Tab 1: Jira/Tasks Board -->
        <div id="jiraTab" class="tab-content active">
            <div class="tab-header">
                <div class="tab-header-left">
                    <button id="newTaskBtn" class="btn-primary">
                        <span>➕</span> New Task
                    </button>
                </div>
                <div class="tab-header-right">
                    <button id="clearAllBtn" class="btn-danger">
                        Clear All Tasks
                    </button>
                </div>
            </div>
            
            <div class="kanban-board">
                <div class="kanban-column" data-status="todo">
                    <div class="column-header">
                        <span class="column-icon">📝</span>
                        <h2 class="column-title">To Do</h2>
                        <span class="task-count" id="todoCount">0</span>
                    </div>
                    <div class="column-content" id="todoColumn">
                        <!-- Tasks will be added here -->
                    </div>
                </div>

                <div class="kanban-column" data-status="in-progress">
                    <div class="column-header">
                        <span class="column-icon">🔄</span>
                        <h2 class="column-title">In Progress</h2>
                        <span class="task-count" id="inProgressCount">0</span>
                    </div>
                    <div class="column-content" id="inProgressColumn">
                        <!-- Tasks will be added here -->
                    </div>
                </div>

                <div class="kanban-column" data-status="done">
                    <div class="column-header">
                        <span class="column-icon">✅</span>
                        <h2 class="column-title">Done</h2>
                        <span class="task-count" id="doneCount">0</span>
                    </div>
                    <div class="column-content" id="doneColumn">
                        <!-- Tasks will be added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Code Editor -->
        <div id="editorTab" class="tab-content">
            <div class="editor-container">
                <div class="editor-header">
                    <div class="editor-controls">
                        <label for="languageSelect" class="editor-label">Language:</label>
                        <select id="languageSelect" class="language-select">
                            <option value="go">Go</option>
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                        </select>
                    </div>
                    <div class="editor-controls">
                        <label for="programSelect" class="editor-label">Program:</label>
                        <select id="programSelect" class="language-select">
                            <option value="custom">Custom</option>
                            <option value="api-handler">REST API Handler</option>
                            <option value="data-validation">Data Validation</option>
                            <option value="error-handler">Error Handler</option>
                        </select>
                    </div>
                </div>

                <div id="monacoEditorContainer" class="monaco-editor-wrapper"></div>

                <div class="pr-section">
                    <label for="prTitle" class="pr-label">PR Title <span style="font-size: 0.85em; color: #666; font-weight: normal;">(must include task name, e.g., task-1: Description)</span></label>
                    <input
                        type="text"
                        id="prTitle"
                        class="pr-title-input"
                        placeholder="e.g., task-1: Add user authentication"
                    />
                    <button id="createPrBtn" class="btn-primary btn-large">
                        Create PR
                    </button>
                </div>

                <div id="prStatus" class="pr-status"></div>
            </div>
        </div>

        <!-- Tab 3: User Settings -->
        <div id="settingsTab" class="tab-content">
            <div class="settings-container">
                
                <!-- API Provider Section -->
                <section class="settings-section">
                    <h3 class="section-title">API Provider Configuration</h3>
                    <div class="provider-selection" style="margin-top: 16px;">
                        <label class="radio-label">
                            <input type="radio" name="provider" value="gemini" checked>
                            <span class="radio-text">
                                <strong>Google Gemini</strong>
                            </span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="provider" value="openai">
                            <span class="radio-text">
                                <strong>OpenAI GPT</strong>
                            </span>
                        </label>
                    </div>
                    
                    <div class="api-key-section">
                        <label for="settingsApiKey" class="input-label">API Key</label>
                        <div class="input-with-icon">
                            <input
                                type="password"
                                id="settingsApiKey"
                                class="settings-input"
                                placeholder="Enter your API key..."
                            />
                            <button type="button" id="toggleApiKeyBtn" class="toggle-password-btn-inside" title="Show/Hide API Key">
                                👁️
                            </button>
                        </div>
                        <div class="button-group">
                            <button id="saveApiKeyBtn" class="btn-primary">Save</button>
                            <button id="clearApiKeyBtn" class="btn-secondary">Clear</button>
                        </div>
                        <span id="apiKeyStatus" class="status-message"></span>
                        <p class="help-text" id="providerInstructions"></p>
                    </div>
                </section>
                
                <!-- Users Configuration Section -->
                <section class="settings-section">
                    <div class="section-header">
                        <h3 class="section-title">Users Configuration</h3>
                        <button id="addUserBtn" class="btn-primary btn-compact">
                            Add User (0/5)
                        </button>
                    </div>
                    <p class="help-text">Add up to 5 users. Each user will receive a code explanation based on their role when you create a PR.</p>
                    
                    <div id="usersContainer" class="users-container">
                        <!-- User cards will be dynamically added here -->
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Task Modal (will be shown/hidden via JS) -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">New Task</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="taskTitle">Title <span class="char-count" id="titleCharCount">0/80</span></label>
                    <input
                        type="text"
                        id="taskTitle"
                        class="form-input"
                        maxlength="80"
                        placeholder="Enter task title..."
                    />
                </div>
                <div class="form-group">
                    <label for="taggedUsers">Tagged Users</label>
                    <div id="taggedUsersContainer" class="tagged-users-container">
                        <!-- Tagged users will appear here -->
                    </div>
                    <select id="userTagSelect" class="form-select">
                        <option value="">-- Tag a user --</option>
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description <span class="char-count" id="descCharCount">0/255</span></label>
                    <textarea
                        id="taskDescription"
                        class="form-textarea"
                        maxlength="255"
                        placeholder="Enter task description..."
                        rows="4"
                    ></textarea>
                </div>
                <div id="taskComments" class="task-comments">
                    <!-- Comments will be displayed here -->
                </div>
            </div>
            <div class="modal-footer">
                <button id="deleteTaskBtn" class="btn-danger">Delete</button>
                <div style="margin-left: auto; display: flex; gap: 8px;">
                    <button id="cancelTaskBtn" class="btn-secondary">Close</button>
                    <button id="saveTaskBtn" class="btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay for modal -->
    <div id="modalOverlay" class="modal-overlay"></div>

    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    
    <!-- JavaScript -->
    <script src="config.js?v=20260516041630"></script>
    <script src="app.js?v=20260516041630"></script>
    <script src="taskManager.js?v=20260516041630"></script>
    <script src="prProcessor.js?v=20260516041630"></script>
</body>
</html>
